
syntax = "proto3";

package mr_proto;

enum TaskType {
  // coordinator tells the worker that tasks are in-progress
  // but phase barrier isn't reached yet , sleep and poll again
  WAIT = 0;
  MAP = 1;    // worker doing map task
  REDUCE = 2; // worker doing reduce task
  // coordinator tell worker to shutdown, task are finished
  SHUTDOWN = 3;
}

// Worker asks Coordinator for work
message PollRequest { string worker_id = 1; }

message TaskAssignment {

  // every time a task is assigned, the
  // coordinator increments this number, if a
  // worker takes too long and lease expires
  // any late commit with an old generation_id is rejected
  int64 generation_id = 1;

  // for map tasks, specifies the exact byte slice in the
  // input files
  uint64 offset = 2;
  uint64 length = 3;
  string input_file = 4;
  int32 num_reduce_tasks = 5;

  // for reduce tasks,provides the list of all
  // partition files mr-<map_id>-<reduce_id>.data
  // generated by completed map workers
  repeated string intermediate_paths = 6;

  // used by coordinator as a checklist
  // each number refers to slice of data
  // also used to name partition files
  int64 task_id = 7;
  TaskType type = 8;
}

// workers notifies co-ordinator of completion
message CompleteRequest {
  int64 generation_id = 1;
  repeated string file_paths = 2;
}

// coordinator acknowledges
message CompleteReply { bool accepted = 1; }

// reduce worker reports missing/corrupt intermediate partition
message ShuffleErrorReport {
  int64 generation_id = 1;
  // here we did not choose repeated string
  // because workers fail-fast(stops on the first error thrown)
  // both are valid designs
  string missing_path = 2;
  string error_message = 3;
}

message ShuffleErrorReply { bool acknowledged = 1; }

service MapReduceService {
  // Worker pulls a task (WAIT, MAP, REDUCE, or SHUTDOWN)
  rpc PollTask(PollRequest) returns (TaskAssignment);

  // Worker reports that it committed its files successfully
  rpc CompleteTask(CompleteRequest) returns (CompleteReply);

  // Reduce worker reports an unreadable/missing intermediate map partition
  rpc ReportShuffleError(ShuffleErrorReport) returns (ShuffleErrorReply);
}